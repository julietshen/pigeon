[project]
name = "pigeon"
version = "0.1.0"
description = "Integration service that makes open-weight safety models usable as Coop signals and Osprey rule functions."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "litellm>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pigeon = "pigeon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigeon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
