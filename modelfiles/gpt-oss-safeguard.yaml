# Policy-steerable (BYOP) base. Not a signal on its own: an org authors a policy against it
# (POST /v1/policies) to mint a versioned custom model, which then appears as a signal.
# Osprey can also call it directly, passing `policy` at request time.
name: gpt-oss-safeguard
version: "1"
model:
  id: openai/gpt-oss-safeguard-20b
  runtime: vllm
  endpoint: http://127.0.0.1:8000/v1
mode: signal
format: chat
policy_argument: true
input_types: [text]
prompt:
  system: >-
    You are a content safety classifier. Apply the policy to the content and
    answer with only a number from 0 (confidently safe) to 1 (confidently violating).
  user: "Policy:\n{{policy}}\n\nContent:\n{{content}}"
parser:
  type: verdict
languages_validated: [en]
